<!DOCTYPE html>
<html lang = "zh">
  <head>
    <title>魔法药水实验室</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="laboratory">
    <h1>欢迎来到神奇的魔法药水实验室</h1>
    <p>选择任意两样你感兴趣的材料，开始炼药之旅吧！</p>
    <div class="ingredients">
      <button class="flower" onclick="selectItem('夜光花')">夜光花</button>
      <button class="leaf" onclick="selectItem('水晶叶')">水晶叶</button>
      <button class="mushroom" onclick="selectItem('虚空菇')">虚空菇</button>
      <button class="fruit" onclick="selectItem('水晶果')">水晶果</button>
      <button class="start" onclick="startMix()">开始调配</button>
    </div>
      <script src="script.js" defer></script>
    </main>
  </body>
</html>
